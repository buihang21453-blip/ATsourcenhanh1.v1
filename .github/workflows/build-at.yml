name: PES_Arena_AT_Nhanh1_SetTeam_CoreHook_v1.5.1

on:
  # Tu dong build moi khi upload/commit vao main.
  push:
    branches: [ "main" ]
  # Van giu nut Run workflow de khi can co the build lai thu cong.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify build tools
        shell: cmd
        run: |
          where cl
          where link
          where nmake
          where rc
          where ml64
          where fxc

      - name: Build AT.exe and at.dll
        shell: cmd
        run: |
          nmake clean
          nmake all

      - name: Create release folder
        shell: cmd
        run: call MAKE_RELEASE.cmd

      - name: Create Release ZIP
        shell: powershell
        run: Compress-Archive -Path release\* -DestinationPath PES_Arena_AT_Nhanh1_SetTeam_CoreHook_v1.5.1_Release.zip -Force

      - name: Upload Release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PES_Arena_AT_Nhanh1_SetTeam_CoreHook_v1.5.1_Release
          path: PES_Arena_AT_Nhanh1_SetTeam_CoreHook_v1.5.1_Release.zip
          if-no-files-found: error

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Setup EXE
        shell: cmd
        run: |
          if not exist "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" exit /b 1
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\AT_Setup.iss

      - name: Upload Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: PES_Arena_AT_Nhanh1_SetTeam_CoreHook_v1.5.1_Setup
          path: installer\output\PES_Arena_AT_Nhanh1_SetTeam_CoreHook_v1.5.1_Setup.exe
          if-no-files-found: error
